name: Aggiorna la conoscenza
on:
  push:
    branches: [main]
    paths: ["conoscenza/**", "faq.json", "strumenti/unisci.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 strumenti/unisci.py
      - run: |
          git config user.name "aggiorna-conoscenza"
          git config user.email "actions@users.noreply.github.com"
          git add conoscenza.txt conoscenza.json
          git diff --cached --quiet || git commit -m "Conoscenza aggiornata"
          git push
